name: Test & Build Retro Arcade Studio

on:
  push:
    branches: [retro-arcade-studio]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run 50-Game Verification Suite
        run: npm test

      - name: Build ROMs & Standalone Bundle
        run: npm run build:rom
